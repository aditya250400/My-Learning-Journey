<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Jasa pembuatan website terpercaya | AditWeb</title>
    <!--title kurleb 60 karakter -->

    <!--Meta description kurleb 140-160 karakter -->
    <meta
      name="description"
      content="Gunakan jasa pembuatan website kami! Gratis Hosting & Domain 1 tahun hana 500.000an. Profile perusahaan, toko online, sistem informasi, blog, dan lain-lain"
    />

    <!-- open graph meta tag -->
    <meta
      property="og:title"
      content="Jasa pembuatan website terpercaya | AditWeb"
    />
    <meta property="og:site_name" content="" />
    <meta property="og:url" content="https://www.aditweb.com/index.html" />

      content="Gunakan jasa pembuatan website kami! Gratis Hosting & Domain 1 tahun hana 500.000an. Profile perusahaan, toko online, sistem informasi, blog, dan lain-lain"
    />
    <meta property="og:type" content="article" />
    <meta property="og:image" content="https://placehold.co/600x400" />

    <!-- hreflang and canonical-->
    <link
      rel="canonical"
      hreflang="id"
      href="https://www.aditweb.com/index.html"
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://www.aditweb.com/english.html"
    />
    <link
      rel="alternate"
      hreflang="id-my"
      href="https://www.aditweb.com/indonesia-malaysia.html"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://www.aditweb.com/index.html"
    />
  </head>
